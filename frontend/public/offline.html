<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1E3A8A">
    <title>Connexion requise — PocketNet</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #0F172A; background: #F8FAFC; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; min-height: 100svh; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 440px); padding: 32px 26px; border: 1px solid #E2E8F0; border-radius: 16px; background: #FFFFFF; text-align: center; }
      img { width: 76px; height: 76px; margin-bottom: 18px; border-radius: 18px; }
      h1 { margin: 0 0 10px; color: #1E3A8A; font-size: 1.5rem; }
      p { margin: 0 0 22px; color: #475569; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 8px; background: #1E3A8A; color: #FFFFFF; font-weight: 650; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/static/brand/pocketnet-icon.svg" alt="">
      <h1>Connexion Internet requise</h1>
      <p>PocketNet n’est pas disponible hors ligne pour le moment. Reconnectez-vous à Internet pour ouvrir l’application et utiliser les services en ligne.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
